# CFPB — ECOA / Regulation B — Equal Credit Opportunity
# Source: Equal Credit Opportunity Act 15 U.S.C. §§ 1691-1691f; Reg B 12 C.F.R. § 1002
# Rule text: A creditor shall not discriminate against any applicant on the basis
# of race, color, religion, national origin, sex, marital status, age, receipt of
# public assistance, or exercise of rights under the Consumer Credit Protection Act.
# Creditors must provide written notice of adverse action with specific reasons.
# ⚠ REGULATORY COUNSEL REVIEW REQUIRED before deploying to production.

id: cfpb_ecoa_credit_decision
name: CFPB / ECOA — Equal Credit Opportunity & Non-Discrimination (Regulation B)
regulation_ref: "ECOA 15 U.S.C. §§ 1691-1691f; Reg B 12 C.F.R. § 1002; CFPB Reg B"
description: >
  Blocks loan decisions where the required non-discrimination basis reference
  and credit decision methodology reference are absent, ensuring AI agents
  document the objective, non-discriminatory basis for each credit decision.
  Under ECOA / Reg B, creditors must not discriminate on protected characteristics
  and must document the specific, lawful basis for adverse credit decisions.
check_type: required_fields
action_types:
  - loan_decision
params:
  required:
    - customer_id
    - account_id
    - credit_decision_basis_ref
    - non_discrimination_attestation_ref
violation_code: CFPB_ECOA_DOCUMENTATION_MISSING
severity: hard_block
rationale_template: >
  Loan decision is missing required ECOA non-discrimination documentation:
  {missing_fields}. Blocked under ECOA (15 U.S.C. § 1691) and Reg B
  (12 C.F.R. § 1002.9). Document the specific, non-discriminatory basis for
  the credit decision and provide the required attestation references before
  proceeding.
