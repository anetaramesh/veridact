# FinCEN / BSA — Currency Transaction Report (CTR) Threshold
# Source: Bank Secrecy Act 31 U.S.C. § 5313; 31 C.F.R. § 1010.311
# Effective: October 1992 (FinCEN Form 104)
# Rule text: Financial institutions must file a CTR for each transaction in
# currency (cash) of more than $10,000 conducted by, through, or to the institution.
# ⚠ REGULATORY COUNSEL REVIEW REQUIRED before deploying to production.

id: fincen_ctr_threshold
name: FinCEN / BSA — Currency Transaction Report (CTR) Required
regulation_ref: "BSA 31 U.S.C. § 5313; 31 C.F.R. § 1010.311; FinCEN Form 104"
description: >
  Places a soft hold on cash transactions exceeding $10,000 USD to ensure a
  Currency Transaction Report (CTR) is filed with FinCEN before or at the
  time of the transaction. AI agents must not autonomously execute transactions
  above this threshold without compliance desk confirmation that the CTR
  obligation has been satisfied.
  Implements: BSA 31 U.S.C. § 5313 (Currency Reporting) and 31 C.F.R. § 1010.311.
check_type: threshold
action_types:
  - wire_transfer
  - ach_payment
  - check_issuance
  - internal_transfer
params:
  field: amount
  max_value: 10000
violation_code: FINCEN_CTR_REQUIRED
severity: soft_hold
rationale_template: >
  Transaction amount ${amount} exceeds the $10,000 CTR filing threshold under
  BSA 31 U.S.C. § 5313. Transaction placed on soft hold — confirm that FinCEN
  Form 104 (CTR) has been filed or is scheduled before proceeding.
  Do not inform the customer that a CTR is being filed.
