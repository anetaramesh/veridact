# OCC / Federal Reserve — Regulation E (Electronic Fund Transfer Act)
# Source: Electronic Fund Transfer Act 15 U.S.C. § 1693; Reg E 12 C.F.R. § 1005
# Rule text: A financial institution may not impose a fee or charge in connection
# with an electronic fund transfer unless the consumer has authorised the transfer.
# Preauthorised EFTs require written (or electronic) signed authorisation.
# ⚠ REGULATORY COUNSEL REVIEW REQUIRED before deploying to production.

id: occ_reg_e_authorization
name: OCC / Fed — Regulation E — EFT Authorization Required
regulation_ref: "EFTA 15 U.S.C. § 1693; Reg E 12 C.F.R. § 1005; CFPB Reg E"
description: >
  Blocks electronic fund transfers where the required EFT authorisation
  reference is absent. Under EFTA / Reg E, preauthorised EFTs must have a
  signed written authorisation from the consumer. AI agents initiating
  electronic fund transfers must include the EFT authorisation reference in
  every submission to confirm consumer consent.
  Implements: Reg E § 1005.10 (Preauthorised Transfers).
check_type: required_fields
action_types:
  - wire_transfer
  - ach_payment
  - internal_transfer
params:
  required:
    - customer_id
    - account_id
    - eft_authorization_ref
violation_code: OCC_REG_E_AUTHORIZATION_MISSING
severity: hard_block
rationale_template: >
  Electronic fund transfer is missing the required EFT authorisation reference:
  {missing_fields}. Blocked under EFTA (15 U.S.C. § 1693e) and Reg E
  (12 C.F.R. § 1005.10). Obtain signed consumer authorisation for preauthorised
  EFT before initiating this transfer.
