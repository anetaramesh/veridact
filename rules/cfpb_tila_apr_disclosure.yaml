# CFPB — TILA / Regulation Z — Truth in Lending
# Source: Truth in Lending Act 15 U.S.C. §§ 1601-1667f; Reg Z 12 C.F.R. § 1026
# Rule text: Creditors must clearly and conspicuously disclose the annual
# percentage rate (APR), finance charge, amount financed, total of payments,
# and payment schedule before consummating a consumer credit transaction.
# ⚠ REGULATORY COUNSEL REVIEW REQUIRED before deploying to production.

id: cfpb_tila_apr_disclosure
name: CFPB / TILA — Truth in Lending APR Disclosure (Regulation Z)
regulation_ref: "TILA 15 U.S.C. §§ 1601-1667f; Reg Z 12 C.F.R. § 1026; CFPB Regulation Z"
description: >
  Blocks loan decisions where the required Truth in Lending disclosures are
  absent — specifically the APR disclosure reference, loan term disclosure,
  and finance charge acknowledgement.
  Under TILA / Reg Z, creditors must provide complete cost-of-credit disclosures
  before consummating consumer credit transactions. AI agents processing loan
  decisions must include disclosure references in every submission.
check_type: required_fields
action_types:
  - loan_decision
params:
  required:
    - customer_id
    - account_id
    - apr_disclosure_ref
    - loan_term_disclosure_ref
    - finance_charge_ref
violation_code: CFPB_TILA_DISCLOSURE_MISSING
severity: hard_block
rationale_template: >
  Loan decision is missing required Truth in Lending disclosures: {missing_fields}.
  Blocked under TILA (15 U.S.C. § 1638) and Reg Z (12 C.F.R. § 1026.18).
  Provide APR disclosure, loan term disclosure, and finance charge acknowledgement
  before proceeding. Failure to disclose constitutes a TILA violation.
