id: finra_account_freeze
name: FINRA Frozen Account Check
regulation_ref: FINRA Rule 4511; SEC Rule 17a-3 (17 C.F.R. § 240.17a-3); SEA § 15(b)(4)(E)
description: 'Blocks all transactions on accounts flagged as frozen due to regulatory
  action, court order, or fraud investigation. Implements: FINRA Rule 4511 (books
  and records); SEC Rule 17a-3 (17 C.F.R. § 240.17a-3) (restricted account records);
  Securities Exchange Act § 15(b)(4)(E).

  '
check_type: account_status
action_types:
- '*'
params:
  field: account_id
  # frozen_accounts is intentionally empty — live FINRA BrokerCheck lookups are
  # performed via FinraDataProvider.is_account_restricted() when a LiveDataProvider
  # is wired into AGTAdapter.  Set FINRA_CLIENT_ID and FINRA_CLIENT_SECRET to enable.
  frozen_accounts: []
violation_code: ACCOUNT_FROZEN
severity: hard_block
rationale_template: 'Account ''{account_id}'' is subject to a regulatory or court-ordered
  freeze. All transactions are blocked under FINRA Rule 4511 and SEC Rule 17a-3. Contact
  the compliance desk to resolve the account restriction before retrying.

  '
